[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# left blank on purpose — alembic/env.py sets this at runtime from
# app.core.config.Settings.resolved_database_url() (RAG_* env vars / .env),
# so migrations always target the same database the app itself would use.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
