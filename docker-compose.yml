services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # REST 
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # # only needed when RAG_REDIS_RATE_LIMIT=true (shared rate limit across
  # # replicas); not started by `docker compose up` without --profile redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: rag-redis
  #   restart: unless-stopped
  #   profiles: ["redis"]
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

volumes:
  qdrant_storage:
  # redis_data:
